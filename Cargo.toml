[workspace]
members = [".", "crates/public-snapshot", "crates/wrkgn-web"]
resolver = "3"

[package]
name = "wrkgn"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "wrkgn"

[dependencies]
wrkgn-public-snapshot = { path = "crates/public-snapshot" }
rig-core = { git = "https://github.com/0xPlaygrounds/rig", rev = "7dfd8a4229a9d89af159489687cb14b404b2871d", features = ["reqwest"] }
rig-agent = { git = "https://github.com/0xPlaygrounds/rig", rev = "7dfd8a4229a9d89af159489687cb14b404b2871d" }
serde = { version = "1", features = ["derive"] }
schemars = "1"
dotenvy = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }
url = "2"
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
tempfile = "3.27.0"
