[package]
name = "wrkgn-web"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
askama = "0.14"
chrono = { version = "0.4", default-features = false, features = ["std"] }
wrkgn-public-snapshot = { path = "../public-snapshot" }
serde = { version = "1", features = ["derive"] }
url = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
arc-swap = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
serde_json = "1"
