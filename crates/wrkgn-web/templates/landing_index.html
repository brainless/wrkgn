<section class="directory landing-index container" aria-labelledby="index-heading"><div class="section-heading"><div><span class="eyebrow eyebrow--small">Browse projects</span><h1 id="index-heading">{{ heading }}</h1><p class="landing-intro">{{ intro }}</p></div><p>{{ summary }}</p></div><ul class="landing-index__list">{% for entry in entries %}<li class="landing-index__item"><h2><a href="{{ entry.url }}">{{ entry.label }}</a></h2><p>{{ entry.description }}</p><span class="landing-index__count">{{ entry.count }}</span></li>{% endfor %}</ul></section>
