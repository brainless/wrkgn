<article class="project-card" data-project-id="{{ id }}"><div class="project-card__body"><div><h3><a data-project-link href="{{ url }}">{{ title }}<span class="card-arrow" aria-hidden="true">↗</span></a></h3><p class="project-card__description">{{ description }}</p></div><div class="project-card__meta">{% if !builders.is_empty() %}<p><span class="meta-label">Builders</span>{{ builders }}</p>{% endif %}<time datetime="{{ date.iso }}">{{ date.label }}</time></div></div>{% if !categories.is_empty() %}<div class="project-card__tags">{% for category in categories %}<span class="tag">{{ category }}</span>{% endfor %}</div>{% endif %}</article>
