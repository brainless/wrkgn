<form class="discovery-controls" id="directory-filters" data-controls action="/" method="get"><div class="filter-content"><div class="search-wrap"><label for="project-search">Search projects</label><input id="project-search" name="q" type="search" placeholder="Search projects, problems, people…" autocomplete="off" value="{{ query }}"></div><div class="filter-row">{% for group in groups %}<fieldset data-filter="{{ group.name }}"><legend>{{ group.label }}</legend><div class="filter-options">{% if group.values.is_empty() %}<p class="no-options">No values yet</p>{% endif %}{% for option in group.values %}<label class="filter-choice"><input type="checkbox" name="{{ group.name }}" value="{{ option.slug }}" data-filter-input="{{ group.name }}" {% if option.selected %}checked{% endif %}>{{ option.label }}</label>{% endfor %}</div></fieldset>{% endfor %}</div>{% if detail %}<label class="sort-control">Sort by <select name="sort" data-sort>{% for option in sorts %}<option value="{{ option.slug }}" {% if option.selected %}selected{% endif %}>{{ option.label }}</option>{% endfor %}</select></label>{% endif %}</div><div class="filter-footer"><div class="sidebar-actions"><button class="apply-button" type="submit">Apply filters</button><a class="clear-button" href="/" data-clear>Clear all</a></div><button class="clear-button filter-close enhanced-only" type="button" data-filters-close>Close</button></div></form>
